name: Deploy SutraWerks to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Pull & Sync Production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Ubuntu VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            WEB_ROOT="/var/www/html/sutrawerks"

            mkdir -p "$WEB_ROOT"
            cd "$WEB_ROOT"

            git config --global --add safe.directory "$WEB_ROOT"

            if [ ! -d ".git" ]; then
              echo "Initializing Git repository in production..."
              git init
              git remote add origin https://github.com/AI-Alchemy-Hub/sutrawerks.git
            else
              git remote set-url origin https://github.com/AI-Alchemy-Hub/sutrawerks.git || git remote add origin https://github.com/AI-Alchemy-Hub/sutrawerks.git
            fi

            echo "Fetching and syncing latest changes..."
            git fetch --all --tags
            git checkout main || git checkout -b main origin/main
            git reset --hard origin/main

            echo "Applying production .htaccess configuration..."
            if [ -f ".htaccess-production" ]; then
              cp .htaccess-production .htaccess
              echo ".htaccess successfully generated from template."
            else
              echo "Error: .htaccess-production template missing!" >&2
              exit 1
            fi

            echo "Correcting file permissions and ownership for Apache..."
            chown -R www-data:www-data "$WEB_ROOT"
            find "$WEB_ROOT" -type d -exec chmod 755 {} \;
            find "$WEB_ROOT" -type f -exec chmod 644 {} \;
            # Ensure .htaccess remains readable by Apache
            chmod 644 "$WEB_ROOT/.htaccess"

            echo "Restarting Apache web server..."
            systemctl restart apache2

            echo "Deployment and synchronization completed successfully at $(date -u)"